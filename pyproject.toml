[project]
name = "agent-memory"
version = "0.1.0"
description = "Long-term memory for AI agents: episodic, semantic, and procedural memory with hybrid retrieval, consolidation, forgetting, and a Model Context Protocol server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Adeolu Ogunnoiki" }]
keywords = ["agents", "memory", "llm", "mcp", "retrieval", "sqlite"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "mcp>=2.0",
]

[project.urls]
Homepage = "https://github.com/adeoluo/agent-memory"
Repository = "https://github.com/adeoluo/agent-memory"

[project.scripts]
agent-memory = "agent_memory.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory"]

[tool.hatch.build.targets.sdist]
include = ["src/agent_memory", "tests", "benchmarks", "README.md", "LICENSE", "pyproject.toml"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["SIM905"]

[tool.ruff.lint.isort]
known-first-party = ["agent_memory"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
addopts = "-ra -q --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true
