services:
  memory:
    build: .
    env_file: .env
    environment:
      AGENT_MEMORY_DATABASE: /data/memory.db
    volumes:
      - memory-data:/data
    # The MCP server speaks JSON-RPC over standard input and output.
    stdin_open: true
    command: ["agent-memory", "mcp"]

volumes:
  memory-data:
