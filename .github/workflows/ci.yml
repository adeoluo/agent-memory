name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: format · lint · type · test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy strict)
        run: uv run mypy src tests

      - name: Test (+ coverage gate)
        run: uv run pytest --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=90

      - name: Benchmark smoke run
        run: uv run agent-memory benchmark --users 3 --sessions 8 --scaling 8

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  build:
    name: build (wheel + sdist + image)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
      - name: Build wheel and source distribution
        run: uv build
      - name: Install the wheel into a clean environment and smoke test the console script
        run: |
          uv venv wheel-check --python 3.12
          uv pip install --python wheel-check dist/*.whl
          wheel-check/bin/agent-memory --version
          wheel-check/bin/agent-memory --database wheel-check/memory.db add "My favorite editor is Helix."
          wheel-check/bin/agent-memory --database wheel-check/memory.db recall "favorite editor" | grep Helix
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
      - name: Build Docker image
        run: docker build -t ${{ github.event.repository.name }}:ci .
